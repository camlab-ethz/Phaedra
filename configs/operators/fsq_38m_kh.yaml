model_type: seq2seq

dataset:
  path: "${oc.env:PHAEDRA_DATA_ROOT}/tokens/fsq/CEU2D_KelvinHelmholtzTokens.nc"
  token_type: fsq
  variable_order: [rho, u, v, p]
  input_variables: [rho, u, v, p]
  output_variables: [rho, u, v, p]
  split_train: train
  split_val: val
  pair_mode_train: all_even_forward
  pair_mode_val: fixed
  time_start: 0
  time_end: 14
  time_step: 2
  fixed_input_time: 0
  fixed_output_time: 14
  max_train_members: null
  max_val_members: null
  num_workers: 8
  batch_size_train: 32
  batch_size_val: 8
  fsq_vocab_size: 8640

model:
  grid_size: 32
  embed_dim: 288
  encoder_depth: 19
  decoder_depth: 10
  num_heads: 8
  mlp_ratio: 4
  fusion: none
  layerscale_init: 1.0e-5
  max_time_index: 14
  problem_type_embed_scale: 1.0

training:
  epochs: 50
  lr: 4.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  focal_gamma: 2.0
  focal_alpha: null
  grad_clip: 1.0
  mixed_precision: bf16
  log_every: 20
  val_every: 200
  checkpoint_every: 500
  resume_from: null

budget:
  target_params: 38000000
  tolerance: 1000000

wandb:
  enabled: false
  project: phaedra
  entity: null
  run_name: fsq_38m_kh
  mode: offline

validation:
  max_batches: 16
  max_plots: 0
  output_dir: "${oc.env:PHAEDRA_OUTPUT_ROOT}/operators/fsq_38m_kh"
  decoder_enabled: true
  model_name: AE_FSQ
  model_path: "${oc.env:PHAEDRA_OUTPUT_ROOT}/tokenizers/fsq"
  use_ema: true

testing:
  split: test
  checkpoint: "${oc.env:PHAEDRA_OUTPUT_ROOT}/operators/fsq_38m_kh"
  max_plots: 2
  max_members: null
  input_time_idx: 0
  final_time_idx: 14
  timing_samples: 50
  source_fields_path: "${oc.env:PHAEDRA_DATA_ROOT}/fields/CEU_2D_KelvinHelmholtzLowRes.nc"
  dataset_name: ceu_kh
  output_dir: "${oc.env:PHAEDRA_OUTPUT_ROOT}/operators/fsq_38m_kh/test"
  rollouts:
    - name: step_6_rollout
      display_name: Step-6 Rollout
      step: 6

runtime:
  seed: 42
  ddp: false
  tf32: true
