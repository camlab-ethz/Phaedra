[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phaedra"
version = "1.0.0"
description = "High-Fidelity Discrete Tokenization for the Physical Sciences"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Levi Lingsch", email = "levi.lingsch@ai.ethz.ch"},
    {name = "Georgios Kissas"},
    {name = "Johannes Jakubik"},
    {name = "Siddhartha Mishra"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["tokenization", "physical sciences", "deep learning", "quantization", "operator learning", "PDE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "einops>=0.6",
    "omegaconf>=2.3",
    "accelerate>=0.20",
    "torch-ema>=0.3",
    "matplotlib>=3.8",
    "netCDF4>=1.6",
    "scipy>=1.10",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
wandb = [
    "wandb>=0.15.0",
]
all = [
    "phaedra[dev,wandb]",
]

[project.urls]
Homepage = "https://github.com/camlab-ethz/Phaedra"
Documentation = "https://camlab-ethz.github.io/Phaedra/"
Repository = "https://github.com/camlab-ethz/Phaedra"
Issues = "https://github.com/camlab-ethz/Phaedra/issues"

[project.scripts]
phaedra-train = "phaedra.train:main"

[tool.setuptools.packages.find]
where = ["."]
# Only the standalone tokenizer package is installed; the reproduction code (tokenizer/, tokens/, hub/,
# baselines/, *_operator/, mae/, evaluation/) runs from the repository checkout (`source env.sh`).
include = ["phaedra*"]

[tool.setuptools.package-data]
phaedra = ["*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
